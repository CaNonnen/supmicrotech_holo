<!DOCTYPE html>

<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Réalité augmentée</title>
    <link rel="stylesheet" href="style.css">

    <script>
      function showErr(t) {
        var d = document.createElement('pre');
        d.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;margin:0;padding:8px;background:#000;color:#0f0;font-size:12px;white-space:pre-wrap';
        d.textContent = t;
        document.documentElement.appendChild(d);
      }
      window.onerror = function (m, s, l) { showErr(m + ' (' + (s || '').split('/').pop() + ':' + l + ')'); };
      window.onunhandledrejection = function (e) { showErr('Promesse rejetée : ' + (e.reason && e.reason.message || e.reason)); };
    </script>

    <!-- import aframe and then ar.js with image tracking / location based features -->
    <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@1c2407b26c61958baa93967b5412487cd94b290b/dist/aframe-master.min.js"></script>
    
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script> 
  
  </head>

  <body>
    <!-- minimal loader shown until image descriptors are loaded. Loading may take a while according to the device computational power -->
    <div class="arjs-loader">
      <div>Loading, please wait...</div>
    </div>

    <!-- a-frame scene -->
    <a-scene
      vr-mode-ui="enabled: false;"
      renderer="logarithmicDepthBuffer: true;"
      embedded
      arjs="trackingMethod: best; sourceType: webcam;debugUIEnabled: false;"
    >
      <!-- a-nft is the anchor that defines an Image Tracking entity -->
      <!-- on 'url' use the path to the Image Descriptors created before. -->
      <!-- the path should end with the name without the extension e.g. if file is 'pinball.fset' the path should end with 'pinball' -->
      <a-nft
        type="nft"
        url="output/futuristic-moon-background"
        smooth="true"
        smoothCount="10"
        smoothTolerance=".01"
        smoothThreshold="5"
      >
        <!-- as a child of the a-nft entity, you can define the content to show. here's a GLTF model entity -->
        <!--<a-entity
          gltf-model="<path-to-your-model>"
          scale="5 5 5"
          position="50 150 0"
        >
        </a-entity>-->
        <a-entity
            geometry="primitive: box"
            material="color: red"
            position="0 0 0"
            scale="50 50 50">
          </a-entity>
      </a-nft>
      <!-- static camera that moves according to the device movemenents -->
      <a-entity camera></a-entity>
    </a-scene>
  </body>

</html>
