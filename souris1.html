<!DOCTYPE html>
<html>

<head>

<body style="margin:0;overflow:hidden">
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

        <a-entity line="start: 12.91 3.8 -3.07; end: 19.3 8.5 -3; color: yellow"></a-entity>
        <a-text value="Molette" position="19.5 8.5 -3" rotation="-90 0 0" anchor="left" width="20" color="yellow"></a-text>

        <a-entity line="start: 12.96 3.6 -1.5; end: 19.3 7 0; color: #7fdc6a"></a-entity>
        <a-text value="Bouton DPI" position="19.5 7 0" rotation="-90 0 0" anchor="left" width="20" color="#7fdc6a"></a-text>

        <a-entity line="start: 11.36 3.5 -2.93; end: 7.7 7 -8; color: red"></a-entity>
        <a-text value="Clic gauche" position="7.5 7 -8" rotation="-90 0 0" anchor="right" width="20" color="red"></a-text>

        <a-entity line="start: 10.03 2.2 -1.81; end: 7.7 7 -3.5; color: #c060e0"></a-entity>
        <a-text value="Bouton avant" position="7.5 7 -3.5" rotation="-90 0 0" anchor="right" width="20" color="#c060e0"></a-text>

        <a-entity line="start: 9.67 2.2 -0.31; end: 7.7 7 1.5; color: orange"></a-entity>
        <a-text value="Bouton retour" position="7.5 7 1.5" rotation="-90 0 0" anchor="right" width="20" color="orange">
        </a-text>

      </a-entity>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>
</body>

</html>
