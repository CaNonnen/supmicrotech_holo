<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin:0;overflow:hidden">
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    <a-marker preset="hiro">
      <a-entity scale="0.0885 0.0885 0.0885">
        <a-entity rotation="0 0 0"> <!-- essaie 0 90 0, 0 180 0, 0 270 0 si besoin -->

          <!-- étalonnage : magenta = +x (attendu : à gauche de la page), vert = +z (attendu : vers le haut) -->
          <a-box position="4 0.75 0" scale="1.5 1.5 1.5" color="magenta"></a-box>
          <a-box position="0 0.75 4" scale="1.5 1.5 1.5" color="lime"></a-box>

          <a-entity line="start: -2.93 3.5 -11.36; end: -6.3 7 -10.8; color: red"></a-entity>
          <a-text value="Clic gauche" position="-6.5 7 -10.8" anchor="left" width="20" color="red"
            look-at="[camera]"></a-text>

          <a-entity line="start: -2.93 3.5 -14.37; end: -6.3 7 -15.6; color: #4aa3ff"></a-entity>
          <a-text value="Clic droit" position="-6.5 7 -15.6" anchor="left" width="20" color="#4aa3ff"
            look-at="[camera]"></a-text>

          <a-entity line="start: -3.07 3.8 -12.91; end: -6.3 7 -12.4; color: yellow"></a-entity>
          <a-text value="Molette" position="-6.5 7 -12.4" anchor="left" width="20" color="yellow"
            look-at="[camera]"></a-text>

          <a-entity line="start: -1.5 3.6 -12.96; end: -6.3 7 -14; color: #7fdc6a"></a-entity>
          <a-text value="Bouton DPI" position="-6.5 7 -14" anchor="left" width="20" color="#7fdc6a"
            look-at="[camera]"></a-text>

          <a-entity line="start: -1.81 2.2 -10.03; end: -6.3 7 -9.2; color: #c060e0"></a-entity>
          <a-text value="Bouton avant" position="-6.5 7 -9.2" anchor="left" width="20" color="#c060e0"
            look-at="[camera]"></a-text>

          <a-entity line="start: -0.31 2.2 -9.67; end: -6.3 7 -7.6; color: orange"></a-entity>
          <a-text value="Bouton arrière" position="-6.5 7 -7.6" anchor="left" width="20" color="orange"
            look-at="[camera]"></a-text>

        </a-entity>
      </a-entity>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>
</body>

</html>
