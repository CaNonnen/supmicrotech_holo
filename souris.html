<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin:0;overflow:hidden">
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    <a-marker preset="hiro">
  <!-- tourne tout le groupe si les flèches sont du mauvais côté : 0, 90, 180 ou 270 -->
  <a-entity rotation="0 0 0">

    <!-- étalonnage : rouge = +x, bleu = +z (à retirer ensuite) -->
    <a-box position="1 0.08 0" scale="0.15 0.15 0.15" color="red"></a-box>
    <a-box position="0 0.08 1" scale="0.15 0.15 0.15" color="blue"></a-box>

    <!-- clic gauche -->
    <a-entity line="start: 1.2 0.15 -0.3; end: 0.9 0.9 -0.9; color: yellow"></a-entity>
    <a-text value="Clic gauche" position="0.9 1.0 -0.9" align="center"
            width="4" color="yellow" look-at="[camera]"></a-text>

    <!-- clic droit -->
    <a-entity line="start: 1.56 0.15 -0.3; end: 1.9 0.9 -0.9; color: orange"></a-entity>
    <a-text value="Clic droit" position="1.9 1.0 -0.9" align="center"
            width="4" color="orange" look-at="[camera]"></a-text>

    <!-- molette -->
    <a-entity line="start: 1.38 0.15 -0.28; end: 1.38 1.3 -0.5; color: cyan"></a-entity>
    <a-text value="Molette" position="1.38 1.4 -0.5" align="center"
            width="4" color="cyan" look-at="[camera]"></a-text>

  </a-entity>
</a-marker>
    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
