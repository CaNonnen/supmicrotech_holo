<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin:0;overflow:hidden">
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    <a-marker preset="hiro">
  <!-- clic gauche (côté haut de la feuille) -->
  <a-entity line="start: -1.22 0.35 0.35; end: -0.8 0.8 0.35; color: yellow"></a-entity>
  <a-text value="Clic gauche" position="-0.8 0.9 0.35" align="center"
          width="1" color="yellow" look-at="[camera]"></a-text>

  <!-- clic droit (côté bas de la feuille) -->
  <a-entity line="start: -1.54 0.35 0.35; end: -1.95 0.8 0.35; color: orange"></a-entity>
  <a-text value="Clic droit" position="-1.95 0.9 0.35" align="center"
          width="1" color="orange" look-at="[camera]"></a-text>

  <!-- molette -->
  <a-entity line="start: -1.38 0.35 0.3; end: -1.38 1.1 0.9; color: cyan"></a-entity>
  <a-text value="Molette" position="-1.38 1.2 0.9" align="center"
          width="1" color="cyan" look-at="[camera]"></a-text>
</a-marker>
    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
