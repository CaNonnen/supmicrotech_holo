<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin:0;overflow:hidden">
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    <a-marker preset="hiro">
  <!-- étalonnage : rouge = +x, bleu = +z, vert = +y (à retirer ensuite) -->
  <a-box position="1 0.08 0" scale="0.15 0.15 0.15" color="red"></a-box>
  <a-box position="0 0.08 1" scale="0.15 0.15 0.15" color="blue"></a-box>
  <a-box position="0 1 0" scale="0.15 0.15 0.15" color="lime"></a-box>

  <!-- clic gauche (côté haut de la feuille, donc z plus petit) -->
  <a-entity line="start: 0.25 0.35 1.25; end: 0.7 0.8 0.9; color: yellow"></a-entity>
  <a-text value="Clic gauche" position="0.7 0.9 0.9" align="center"
          width="1.5" color="yellow" look-at="[camera]"></a-text>

  <!-- clic droit (côté bas de la feuille, donc z plus grand) -->
  <a-entity line="start: 0.25 0.35 1.55; end: 0.7 0.8 1.95; color: orange"></a-entity>
  <a-text value="Clic droit" position="0.7 0.9 1.95" align="center"
          width="1.5" color="orange" look-at="[camera]"></a-text>

  <!-- molette -->
  <a-entity line="start: 0.29 0.35 1.4; end: 1 1 1.4; color: cyan"></a-entity>
  <a-text value="Molette" position="1 1.1 1.4" align="center"
          width="1.5" color="cyan" look-at="[camera]"></a-text>
</a-marker>
    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
