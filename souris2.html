<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin:0;overflow:hidden">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        <!-- <a-marker preset="hiro"> -->
        <a-marker type="pattern" url="supmicrotech.patt">
            <a-entity scale="0.4348 0.4348 0.4348">

                <a-entity line="start: 1.58 3.5 5.67; end: 6 7 4; color: #4aa3ff"></a-entity>
                <a-text value="Clic droit" position="6.2 7 4" rotation="-90 0 0" anchor="left" width="16"
                    color="#4aa3ff"></a-text>

                <a-entity line="start: 0.11 3.8 5.53; end: 6 8.5 7; color: yellow"></a-entity>
                <a-text value="Molette" position="6.2 8.5 7" rotation="-90 0 0" anchor="left" width="16"
                    color="yellow"></a-text>

                <a-entity line="start: 0.14 3.6 7.07; end: 6 7 10; color: #7fdc6a"></a-entity>
                <a-text value="Bouton DPI" position="6.2 7 10" rotation="-90 0 0" anchor="left" width="16"
                    color="#7fdc6a"></a-text>

                <!-- clic gauche -->
                <a-entity line="start: -1.42 3.5 5.67; end: -3.3 0.5 4.3; color: red"></a-entity>
                <a-text value="Clic gauche" position="-3.5 0.5 4.3" rotation="-90 0 0" anchor="right" width="13"
                    color="red"></a-text>

                <!-- bouton avant -->
                <a-entity line="start: -2.73 2.2 6.73; end: -3.3 0.5 6.4; color: #c060e0"></a-entity>
                <a-text value="Bouton avant" position="-3.5 0.5 6.4" rotation="-90 0 0" anchor="right" width="13"
                    color="#c060e0"></a-text>

                <!-- bouton retour -->
                <a-entity line="start: -2.46 2.2 8.22; end: -3.3 0.5 8.5; color: orange"></a-entity>
                <a-text value="Bouton retour" position="-3.5 0.5 8.5" rotation="-90 0 0" anchor="right" width="13"
                    color="orange"></a-text>

            </a-entity>
        </a-marker>
        <a-entity camera></a-entity>
    </a-scene>
</body>

</html>
