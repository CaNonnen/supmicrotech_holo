<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <title>Réalité augmentée</title>

    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
        }
        }

        /* Pas de position/taille imposée sur a-scene ni sur la vidéo :
       AR.js gère lui-même ses marges et dimensions. */
        #debug {
            position: fixed;
            left: 0;
            bottom: 0;
            z-index: 99999;
            margin: 0;
            padding: 6px 8px;
            font: 12px/1.3 monospace;
            color: #0f0;
            background: rgba(0, 0, 0, 0.7);
            white-space: pre;
            display: none;
        }
    </style>
</head>

<body>
    <a-scene embedded vr-mode-ui="enabled: false;" arjs="sourceType: webcam;
          sourceWidth: 960; sourceHeight: 1280;
          displayWidth: 960; displayHeight: 1280;
          debugUIEnabled: false;">

        <a-marker preset="hiro">
            <a-entity scale="0.0885 0.0885 0.0885">

                <a-entity line="start: 14.37 3.5 -2.93; end: 19.3 7 -6; color: #4aa3ff"></a-entity>
                <a-text value="Clic droit" position="19.5 7 -6" rotation="-90 0 0" anchor="left" width="20"
                    color="#4aa3ff"></a-text>

                <a-entity line="start: 12.91 3.8 -3.07; end: 19.3 8.5 -3; color: yellow"></a-entity>
                <a-text value="Molette" position="19.5 8.5 -3" rotation="-90 0 0" anchor="left" width="20"
                    color="yellow"></a-text>

                <a-entity line="start: 12.96 3.6 -1.5; end: 19.3 7 0; color: #7fdc6a"></a-entity>
                <a-text value="Bouton DPI" position="19.5 7 0" rotation="-90 0 0" anchor="left" width="20"
                    color="#7fdc6a"></a-text>

                <a-entity line="start: 11.36 3.5 -2.93; end: 9.2 0.5 -4.5; color: red"></a-entity>
                <a-text value="Clic gauche" position="9 0.5 -4.5" rotation="-90 0 0" anchor="right" width="16"
                    color="red"></a-text>

                <a-entity line="start: 10.03 2.2 -1.81; end: 9.2 0.5 -2.5; color: #c060e0"></a-entity>
                <a-text value="Bouton avant" position="9 0.5 -2.5" rotation="-90 0 0" anchor="right" width="16"
                    color="#c060e0"></a-text>

                <a-entity line="start: 9.67 2.2 -0.31; end: 9.2 0.5 -0.5; color: orange"></a-entity>
                <a-text value="Bouton retour" position="9 0.5 -0.5" rotation="-90 0 0" anchor="right" width="16"
                    color="orange"></a-text>

            </a-entity>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <pre id="debug"></pre>

    <script>
        // Force AR.js à recalculer la taille de la vidéo et du canvas
        // une fois que le flux caméra est réellement disponible.
        const nudge = () => window.dispatchEvent(new Event('resize'));

        window.addEventListener('arjs-video-loaded', () => {
            [0, 300, 1000, 2500].forEach(t => setTimeout(nudge, t));
            showDebug();
        });

        window.addEventListener('orientationchange', () => setTimeout(nudge, 400));

        // Diagnostic : ouvre la page avec ?debug à la fin de l'URL
        function showDebug() {
            if (!location.search.includes('debug')) return;
            const el = document.getElementById('debug');
            el.style.display = 'block';
            const update = () => {
                const v = document.querySelector('#arjs-video');
                if (!v) return;
                el.textContent =
                    `flux : ${v.videoWidth}x${v.videoHeight}\n` +
                    `écran: ${innerWidth}x${innerHeight}\n` +
                    `style: ${v.style.width} x ${v.style.height}\n` +
                    `marge: L ${v.style.marginLeft} / T ${v.style.marginTop}`;
            };
            update();
            setInterval(update, 1000);
        }
    </script>
</body>

</html>
